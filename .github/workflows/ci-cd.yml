name: DevOps Multi-Job Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # JOB 1: Code Checkout
  checkout:
    name: Checkout Source Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Project Files
        run: ls -la


  # JOB 2: Build
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check HTML File
        run: test -f index.html

      - name: Build Message
        run: echo "Build completed successfully"


  # JOB 3: Test
  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Website Content
        run: grep -q "Hello DevOps!" index.html

      - name: Test Message
        run: echo "Testing completed successfully"


  # JOB 4: Docker Build
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Dockerfile
        run: test -f Dockerfile

      - name: Build Docker Image
        run: docker build -t devops-web:v1 .

      - name: Show Docker Images
        run: docker images
