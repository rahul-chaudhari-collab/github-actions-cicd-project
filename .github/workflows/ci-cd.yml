```yaml
name: My First CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Project Files
        run: ls -la

      - name: Build Check
        run: |
          test -f index.html
          echo "Build check successful"

      - name: Test Website
        run: |
          grep -q "Hello DevOps!" index.html
          echo "Website test successful"
```
